[package]
name = "rex-kiosk"
version = "0.1.0"
edition = "2024"
description = "Fuzzy repo and branch picker for Rex"
license = "MIT"
authors = ["thomasschafer97@gmail.com"]
readme = "README.md"
homepage = "https://github.com/thomasschafer/rex-kiosk"
repository = "https://github.com/thomasschafer/rex-kiosk"
keywords = ["cli", "worktree", "git", "tui", "rex"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
kiosk-core = "0.3"
kiosk-tui = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
kiosk-core = { version = "0.3", features = ["test-support"] }
mlua = { version = "0.12.2", features = ["lua51", "vendored", "serialize"] }
tempfile = "3"

[workspace]
members = [".", "xtask"]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints]
workspace = true

[profile.release]
lto = true
